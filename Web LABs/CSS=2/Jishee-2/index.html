<!DOCTYPE html>
<html lang="mn">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initail-scale=1.0">
        <title>Монголын байгаль - зургийн цомог</title>
        <link rel="Stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header" id="top">
            <h1>Монголын байгаль</h1>
        </header>
        <main class="gallery">
            <figure class="gallery_item gallery_item--featured">
                <img src="images/1.svg" alt="Хөвсгөл нуурын үдшийн бүрэнхий">
                <figcaption>Хөвсгөл нуур</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/2.svg" alt="Хонгорын элсний манхан">
                <figcaption>Хонгорын элс</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/3.svg" alt="Алтайн цаст оргилууд">
                <figcaption>Алтайн таван богд</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/4.svg" alt="Тэрхийн цагаан нуурын эрэг">
                <figcaption>Тэрхийн цагаан нуур</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/5.svg" alt="Орхон хөндийн ус">
                <figcaption>Орхон хөндий</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/6.svg" alt="Баянзагийн час улаан хад">
                <figcaption>Баянзаг</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/6.svg" alt="Хангайн ногоон хөндий">
                <figcaption>Хангайн хөндий</figcaption>
            </figure>
            <figure class="gallery_item">
                <img src="images/7.svg" alt="Дорнодын тал нутгийн жаргалтын цаг">
                <figcaption>Дорнодын тал</figcaption>
            </figure>
        </main>
        <footer class="site-footer">@ 2026 Миний цомог</footer>
    </body>
</html>
